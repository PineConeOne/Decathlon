<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Track and Field Calculator</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 4rem auto; padding: 0 1rem; text-align: center; }
        .row { display: flex; gap: 1rem; justify-content: center; margin-top: 2rem; }
        button { font-size: 1.1rem; padding: .75rem 1.5rem; border-radius: 10px; border: 1px solid #ddd; cursor: pointer; background: #fff; }
        button:hover { background: #f5f5f5; }
    </style>
</head>
<body>
<h1>Track and Field Calculator</h1>
<p>Choose which competition you want to work with.</p>
<div class="row">
    <button id="chooseDecathlon" data-testid="chooseDecathlonBtn">Decathlon</button>
    <button id="chooseHeptathlon" data-testid="chooseHeptathlonBtn">Heptathlon</button>
</div>
<script>
    document.getElementById('chooseDecathlon').addEventListener('click', () => {
        window.location.href = 'app.html?competition=Decathlon';
    });
    document.getElementById('chooseHeptathlon').addEventListener('click', () => {
        window.location.href = 'app.html?competition=Heptathlon';
    });
</script>
</body>
</html>
